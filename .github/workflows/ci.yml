name: TrussVision checks

on:
  push:
    branches: [main, new-ui]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Vetin regression suite
        run: node tests/run-tests.js
      - name: Run TrussVision contract checks
        run: node tests/trussvision-checks.js
      - name: Validate deployment references
        run: node tools/check-deploy.js
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check trussvision/app.js
          node --check trussvision/gemini-client.js
          node --check trussvision/vetin-export.js
          node --check netlify/functions/analyze.cjs
