<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=trussvision/">
  <title>TrussVision</title>
</head>
<body>
  <p>Opening <a href="trussvision/">TrussVision</a>…</p>
  <script>
    (() => {
      const target = new URL('trussvision/', location.href).href;
      // Only retire workers scoped to this project. GitHub Pages shares an
      // origin between repositories; clearing all caches/workers harms others.
      const retireProjectWorkers = async () => {
        if (!('serviceWorker' in navigator)) return;
        const projectPath = new URL('./', location.href).pathname;
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations
          .filter(reg => new URL(reg.scope).pathname.startsWith(projectPath))
          .map(reg => reg.unregister()));
      };
      retireProjectWorkers().catch(() => {}).finally(() => location.replace(target));
    })();
  </script>
</body>
</html>
