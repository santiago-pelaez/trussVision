<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=trussvision/">
  <title>TrussVision</title>
</head>
<body>
  <p>Opening <a href="trussvision/">TrussVision</a>…</p>
  <script>
    (() => {
      const target = new URL('trussvision/', location.href).href;
      const retireLegacyWorkers = async () => {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      };
      retireLegacyWorkers().catch(() => {}).finally(() => location.replace(target));
    })();
  </script>
</body>
</html>
